org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Project lives on D: while the Pub cache is on C:. Kotlin's incremental
# compiler computes relative paths between the two and crashes with
# "this and base files have different roots". Disabling incremental Kotlin
# compilation avoids that path-relativization step.
kotlin.incremental=false
