name: waylo
description: "waylo — pin your photos to a map and see your friends' maps."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  supabase_flutter: ^2.15.0
  image_picker: ^1.2.2
  geolocator: ^14.0.3
  photo_manager: ^3.9.0
  permission_handler: ^12.0.3
  mapbox_maps_flutter: ^2.25.0
  flutter_image_compress: ^2.4.0
  uuid: ^4.5.3
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.3.2
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  # Pushes are data-only FCM messages; the app draws every notification itself
  # (foreground and background) so it can carry the real app icon.
  flutter_local_notifications: ^19.0.0
  zoom_pinch_overlay: ^1.4.3
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Generate AppLocalizations from the ARB files in lib/l10n/ (see l10n.yaml).
  generate: true
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/flags/

  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/hanken-grotesk-v12-latin-regular.ttf
          weight: 400
        - asset: assets/fonts/hanken-grotesk-v12-latin-500.ttf
          weight: 500
        - asset: assets/fonts/hanken-grotesk-v12-latin-600.ttf
          weight: 600
        - asset: assets/fonts/hanken-grotesk-v12-latin-700.ttf
          weight: 700
        - asset: assets/fonts/hanken-grotesk-v12-latin-800.ttf
          weight: 800
